      - uses: actions/checkout@v4
      - name: Plan every root against what exists, and keep the drift issue
        shell: bash
        run: |
          set +e -uo pipefail
          terragucci stage tf-drift --out terragucci-report --binary tofu --forge github --layers 'envs/dev/platform,envs/prod/platform,envs/staging/platform;envs/dev/email,envs/dev/orders,envs/dev/payments,envs/dev/search,envs/prod/email,envs/prod/orders,envs/prod/payments,envs/prod/search,envs/staging/email,envs/staging/orders,envs/staging/payments,envs/staging/search' --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
