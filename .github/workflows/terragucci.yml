  tips:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.1-tofu1.13.1@sha256:f7b2c7b8148bbfa6e1410a8926bb1fdeeaca16ed4f3e5959a9884cb823d4a704
    needs: confirm
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: terragucci-tips-${{ github.repository }}
      cancel-in-progress: false
    env:
      TG_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open a pull request for each tip
        shell: bash
        run: |
          set -u
          export GITHUB_TOKEN="$TG_TOKEN"
          terragucci respond tips --mode apply --binary tofu || true
  drift:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/intentius/terragucci-tofu:0.4.1-tofu1.13.1@sha256:f7b2c7b8148bbfa6e1410a8926bb1fdeeaca16ed4f3e5959a9884cb823d4a704
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      TG_TOKEN: '${{ github.token }}'
      TG_SHA: '${{ github.sha }}'
    steps:
      - uses: actions/checkout@v4
      - name: Plan every root against what exists, and keep the drift issue
        shell: bash
        run: |
          set +e -uo pipefail
          terragucci stage tf-drift --out terragucci-report --binary tofu --forge github --layers 'envs/dev/platform,envs/prod/platform,envs/staging/platform;envs/dev/email,envs/dev/orders,envs/dev/payments,envs/dev/search,envs/prod/email,envs/prod/orders,envs/prod/payments,envs/prod/search,envs/staging/email,envs/staging/orders,envs/staging/payments,envs/staging/search' --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          rc=$?
          export GITHUB_TOKEN="$TG_TOKEN"
          if [ "$rc" -eq 0 ]; then terragucci respond drift --mode apply --binary tofu || true; fi
          exit "$rc"
      - name: Keep the drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terragucci-report-drift
          path: terragucci-report/
          if-no-files-found: ignore
